<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FF4D00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF4D00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1518"/>

  <!-- Glow -->
  <ellipse cx="600" cy="420" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(540, 140)">
    <rect width="120" height="120" fill="#FF4D00"/>
    <path d="M30 45h15V26.25h15V45h18.75v15H60v27c0 4.5 1.875 6.75 6.75 6.75H75v15h-11.25c-13.5 0-18.75-5.625-18.75-19.125V60H30V45z" fill="#FFFFFF"/>
    <circle cx="89.25" cy="89.25" r="8.25" fill="#FFFFFF"/>
  </g>

  <!-- Title -->
  <text x="600" y="320" text-anchor="middle" font-family="monospace" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-2">typsmthng</text>

  <!-- Subtitle -->
  <text x="600" y="370" text-anchor="middle" font-family="monospace" font-size="24" fill="#a1929b">A modern Typst editor</text>

  <!-- Pills (total width: 80+20+100+20+80 = 300, centered at 600 = start at 450) -->
  <g transform="translate(450, 410)">
    <rect x="0" y="0" width="80" height="32" fill="none" stroke="#ffffff18" stroke-width="1"/>
    <text x="40" y="21" text-anchor="middle" font-family="monospace" font-size="14" fill="#a1929b">web</text>

    <rect x="100" y="0" width="100" height="32" fill="none" stroke="#ffffff18" stroke-width="1"/>
    <text x="150" y="21" text-anchor="middle" font-family="monospace" font-size="14" fill="#a1929b">desktop</text>

    <rect x="220" y="0" width="80" height="32" fill="none" stroke="#ffffff18" stroke-width="1"/>
    <text x="260" y="21" text-anchor="middle" font-family="monospace" font-size="14" fill="#a1929b">local</text>
  </g>
